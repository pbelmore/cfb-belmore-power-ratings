<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFB Power Ratings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --row-alt: #f7f7f7;
    --accent: #b3121b;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --grid: #e1e0d9;
    --axis-line: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --border: #2c2f34;
      --row-alt: #1b1e23;
      --accent: #ff6b6b;
      --series-1: #3987e5;
      --series-2: #d95926;
      --grid: #2c2c2a;
      --axis-line: #383835;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  .subtitle { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
  .standings-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .standings-controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  .standings-controls button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.65rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .standings-controls button:hover:not(:disabled) { background: var(--row-alt); }
  .standings-controls button:disabled { opacity: 0.4; cursor: default; }
  .standings-controls .week-nav { display: flex; align-items: center; gap: 0.35rem; }
  section.card {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.5rem 0.6rem; text-align: right; white-space: nowrap; }
  th:nth-child(2), td:nth-child(2) { text-align: left; white-space: normal; }
  th:nth-child(3), td:nth-child(3) { text-align: left; white-space: normal; color: var(--muted); }
  thead th {
    border-bottom: 2px solid var(--border);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  td.rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.rating { font-weight: 600; }
  .status { color: var(--muted); padding: 2rem 0; }

  /* Trend charts */
  .chart-controls { margin-bottom: 0.75rem; }
  .chart-controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-axis { font-size: 10px; fill: var(--muted); }
  .chart-tooltip {
    position: absolute;
    top: 4px;
    pointer-events: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.55rem;
    font-size: 0.78rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    min-width: 120px;
  }
  .chart-tooltip-head { color: var(--muted); font-size: 0.72rem; margin-bottom: 0.25rem; }
  .chart-tooltip-row { display: flex; align-items: center; gap: 0.4rem; line-height: 1.5; }
  .chart-tooltip-key { display: inline-block; width: 10px; height: 2px; border-radius: 1px; }
  .chart-tooltip-name { color: var(--muted); }
  .chart-legend { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .chart-legend-item { display: flex; align-items: center; gap: 0.35rem; }
  .chart-legend-key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  details.chart-table-toggle { margin-top: 0.5rem; font-size: 0.82rem; }
  details.chart-table-toggle summary { cursor: pointer; color: var(--muted); }
  details.chart-table-toggle table { margin-top: 0.5rem; font-size: 0.82rem; }

  /* Weekly blurb */
  #blurb-text {
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    background: var(--row-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin: 0 0 0.75rem;
  }
  #blurb-copy {
    font: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  #blurb-copy:hover { background: var(--row-alt); }
</style>
</head>
<body>
<div class="wrap">
  <h1>CFB Power Ratings</h1>
  <p class="subtitle" id="subtitle">Loading&hellip;</p>
  <div class="standings-controls" id="standings-controls" hidden>
    <select id="season-select" aria-label="Select season"></select>
    <div class="week-nav">
      <button type="button" id="week-prev" aria-label="Previous week">&larr;</button>
      <select id="week-select" aria-label="Select week"></select>
      <button type="button" id="week-next" aria-label="Next week">&rarr;</button>
    </div>
  </div>
  <div id="content"></div>

  <section class="card" id="team-trend-card" hidden>
    <h2>Team rating trend</h2>
    <div class="chart-controls">
      <select id="team-select" aria-label="Select team"></select>
    </div>
    <div id="team-chart"></div>
    <div id="team-chart-table"></div>
  </section>

  <section class="card" id="conf-trend-card" hidden>
    <h2>Conference average rating</h2>
    <div class="chart-controls">
      <select id="conf-select" aria-label="Select conference"></select>
    </div>
    <div id="conf-chart"></div>
    <div id="conf-chart-table"></div>
  </section>

  <section class="card" id="blurb-card" hidden>
    <h2>Weekly blurb</h2>
    <pre id="blurb-text"></pre>
    <button id="blurb-copy" type="button">Copy to clipboard</button>
  </section>
</div>

<script src="trends.js"></script>
<script>
function renderStandings(rows, season, asOf) {
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  const current = rows
    .filter(r => r.season === season && r.as_of === asOf)
    .sort((a, b) => b.rating - a.rating);

  subtitle.textContent = `${season} season — as of ${asOf}`;

  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>#</th>
        <th>Team</th>
        <th>Conf</th>
        <th>W</th>
        <th>L</th>
        <th>Win%</th>
        <th>SOS</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody>
      ${current.map((r, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td>${r.team}</td>
          <td>${r.conference ?? ''}</td>
          <td>${r.wins}</td>
          <td>${r.losses}</td>
          <td>${(r.win_pct * 100).toFixed(1)}%</td>
          <td>${r.sos.toFixed(4)}</td>
          <td class="rating">${r.rating.toFixed(4)}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
  content.replaceChildren(table);
}

function weekOptionLabel(index, total, isCompleteSeason) {
  if (index === total - 1) return isCompleteSeason ? 'Final' : 'Latest';
  return `Week ${index + 1}`;
}

function setupStandingsControls(rows) {
  const controls = document.getElementById('standings-controls');
  const seasonSelect = document.getElementById('season-select');
  const weekSelect = document.getElementById('week-select');
  const weekPrev = document.getElementById('week-prev');
  const weekNext = document.getElementById('week-next');

  const seasons = [...new Set(rows.map(r => r.season))].sort((a, b) => b - a);
  const latestSeason = seasons[0];
  seasonSelect.replaceChildren(...seasons.map(s => new Option(String(s), String(s))));

  let asOfsForSeason = [];

  function populateWeeks(season, selectAsOf) {
    asOfsForSeason = [...new Set(rows.filter(r => r.season === season).map(r => r.as_of))].sort();
    const isCompleteSeason = season !== latestSeason;
    weekSelect.replaceChildren(
      ...asOfsForSeason.map((asOf, i) => new Option(weekOptionLabel(i, asOfsForSeason.length, isCompleteSeason), asOf))
    );
    weekSelect.value = selectAsOf && asOfsForSeason.includes(selectAsOf)
      ? selectAsOf
      : asOfsForSeason[asOfsForSeason.length - 1];
  }

  function updateNavButtons() {
    const idx = asOfsForSeason.indexOf(weekSelect.value);
    weekPrev.disabled = idx <= 0;
    weekNext.disabled = idx === -1 || idx >= asOfsForSeason.length - 1;
  }

  function draw() {
    updateNavButtons();
    renderStandings(rows, Number(seasonSelect.value), weekSelect.value);
  }

  seasonSelect.addEventListener('change', () => {
    populateWeeks(Number(seasonSelect.value));
    draw();
  });
  weekSelect.addEventListener('change', draw);
  weekPrev.addEventListener('click', () => {
    const idx = asOfsForSeason.indexOf(weekSelect.value);
    if (idx > 0) { weekSelect.value = asOfsForSeason[idx - 1]; draw(); }
  });
  weekNext.addEventListener('click', () => {
    const idx = asOfsForSeason.indexOf(weekSelect.value);
    if (idx !== -1 && idx < asOfsForSeason.length - 1) { weekSelect.value = asOfsForSeason[idx + 1]; draw(); }
  });

  seasonSelect.value = String(latestSeason);
  populateWeeks(latestSeason);
  controls.hidden = false;
  draw();

  return latestSeason;
}

async function main() {
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  let rows;
  try {
    const res = await fetch('data/ratings_history.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    rows = await res.json();
  } catch (err) {
    subtitle.textContent = '';
    content.innerHTML = `<p class="status">Couldn't load ratings data (${err.message}).</p>`;
    return;
  }

  if (!rows.length) {
    subtitle.textContent = '';
    content.innerHTML = '<p class="status">No data yet.</p>';
    return;
  }

  const latestSeason = setupStandingsControls(rows);

  if (window.renderTrends) window.renderTrends(rows, latestSeason);
  if (window.renderBlurb) window.renderBlurb();
}

main();
</script>
</body>
</html>
