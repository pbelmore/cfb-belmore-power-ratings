<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belmore Rankings (CFB Power Ratings)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --row-alt: #f7f7f7;
    --accent: #b3121b;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --grid: #e1e0d9;
    --axis-line: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --border: #2c2f34;
      --row-alt: #1b1e23;
      --accent: #ff6b6b;
      --series-1: #3987e5;
      --series-2: #d95926;
      --grid: #2c2c2a;
      --axis-line: #383835;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  .subtitle { color: var(--muted); margin: 0 0 0.5rem; font-size: 0.9rem; }
  .accuracy-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    color: var(--accent);
    text-decoration: none;
  }
  .accuracy-link:hover { text-decoration: underline; }
  .standings-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .standings-controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  .standings-controls button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.65rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .standings-controls button:hover:not(:disabled) { background: var(--row-alt); }
  .standings-controls button:disabled { opacity: 0.4; cursor: default; }
  .standings-controls .week-nav { display: flex; align-items: center; gap: 0.35rem; }
  section.card {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.5rem 0.6rem; text-align: right; white-space: nowrap; }
  th:nth-child(2), td:nth-child(2) { text-align: left; white-space: normal; }
  th:nth-child(3), td:nth-child(3) { text-align: left; white-space: normal; color: var(--muted); }
  thead th {
    border-bottom: 2px solid var(--border);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tbody tr.highlight-row {
    border-left: 4px solid var(--team-color, transparent);
    background: color-mix(in srgb, var(--team-color, transparent) 12%, var(--bg));
  }
  tbody tr.highlight-row:nth-child(even) {
    background: color-mix(in srgb, var(--team-color, transparent) 12%, var(--row-alt));
  }
  tbody tr.highlight-row:hover {
    background: color-mix(in srgb, var(--team-color, transparent) 22%, var(--bg));
  }
  td.rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.rating { font-weight: 600; }
  .status { color: var(--muted); padding: 2rem 0; }
  .legend-note { color: var(--muted); font-size: 0.78rem; margin: 0.5rem 0 0; }

  /* Trend charts */
  .chart-controls { margin-bottom: 0.75rem; }
  .chart-controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-axis { font-size: 10px; fill: var(--muted); }
  .chart-tooltip {
    position: absolute;
    top: 4px;
    pointer-events: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.55rem;
    font-size: 0.78rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    min-width: 120px;
  }
  .chart-tooltip-head { color: var(--muted); font-size: 0.72rem; margin-bottom: 0.25rem; }
  .chart-tooltip-row { display: flex; align-items: center; gap: 0.4rem; line-height: 1.5; }
  .chart-tooltip-key { display: inline-block; width: 10px; height: 2px; border-radius: 1px; }
  .chart-tooltip-name { color: var(--muted); }
  .chart-legend { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .chart-legend-item { display: flex; align-items: center; gap: 0.35rem; }
  .chart-legend-key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  details.chart-table-toggle { margin-top: 0.5rem; font-size: 0.82rem; }
  details.chart-table-toggle summary { cursor: pointer; color: var(--muted); }
  details.chart-table-toggle table { margin-top: 0.5rem; font-size: 0.82rem; }

  /* Weekly blurb */
  #blurb-text {
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    background: var(--row-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin: 0 0 0.75rem;
  }
  #blurb-copy {
    font: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  #blurb-copy:hover { background: var(--row-alt); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Belmore Rankings (CFB Power Ratings)</h1>
  <p class="subtitle" id="subtitle">Loading&hellip;</p>
  <a class="accuracy-link" href="accuracy.html">How accurate is this ranking? &rarr;</a>
  <div class="standings-controls" id="standings-controls" hidden>
    <select id="season-select" aria-label="Select season"></select>
    <div class="week-nav">
      <button type="button" id="week-prev" aria-label="Previous week">&larr;</button>
      <select id="week-select" aria-label="Select week"></select>
      <button type="button" id="week-next" aria-label="Next week">&rarr;</button>
    </div>
  </div>
  <div id="content"></div>

  <section class="card" id="team-trend-card" hidden>
    <h2>Team rating trend</h2>
    <div class="chart-controls">
      <select id="team-select" aria-label="Select team"></select>
    </div>
    <div id="team-chart"></div>
    <div id="team-chart-table"></div>
  </section>

  <section class="card" id="conf-trend-card" hidden>
    <h2>Conference average rating</h2>
    <div class="chart-controls">
      <select id="conf-select" aria-label="Select conference"></select>
    </div>
    <div id="conf-chart"></div>
    <div id="conf-chart-table"></div>
  </section>

  <section class="card" id="blurb-card" hidden>
    <h2>Weekly blurb</h2>
    <pre id="blurb-text"></pre>
    <button id="blurb-copy" type="button">Copy to clipboard</button>
  </section>
</div>

<script src="trends.js"></script>
<script>
const HEX_COLOR_RE = /^#[0-9a-fA-F]{6}$/;

// Projects a playoff field from that week's own ratings -- a running "if it
// ended today" bracket, not the actual (end-of-season-only) selection.
// 2010-2013 (BCS): top 2. 2014-2023 (old CFP): top 4. 2024+: the 12-team
// format's 5 highest-rated conference leaders (auto bids -- independents
// can't have one, since there's no conference championship to win) + the
// next 7 best overall.
function getPlayoffProjection(seasonRows, season) {
  const sorted = [...seasonRows].sort((a, b) => b.power_score - a.power_score);
  if (season < 2024) {
    const fieldSize = season < 2014 ? 2 : 4;
    return new Set(sorted.slice(0, fieldSize).map(r => r.team));
  }
  const leaderByConf = new Map();
  for (const r of sorted) {
    if (!r.conference || r.conference === 'FBS Independents') continue;
    if (!leaderByConf.has(r.conference)) leaderByConf.set(r.conference, r);
  }
  const leaders = [...leaderByConf.values()].sort((a, b) => b.power_score - a.power_score).slice(0, 5);
  const leaderNames = new Set(leaders.map(r => r.team));
  const atLarge = sorted.filter(r => !leaderNames.has(r.team)).slice(0, 7);
  return new Set([...leaderNames, ...atLarge.map(r => r.team)]);
}

function renderStandings(current, season, asOf, colors, highlighted) {
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  subtitle.textContent = `${season} season — as of ${asOf}`;

  // Real committee rankings only exist for part of a season (they start
  // partway through, and stop once the field is picked) -- the column
  // itself only appears on weeks where at least one team has one. The *
  // marks a team in the real field, shown from the first ranked week on
  // -- a same-week projection until the true final week, then the exact
  // answer. `seed` is only ever populated for that exact/final case, so
  // checking for it is how we know which one we're looking at, without
  // needing to thread that state in from the caller.
  const hasCommitteeRank = current.some(r => r.committee_rank != null);
  const hasPlayoffField = current.some(r => r.made_playoff != null);
  const isExactField = current.some(r => r.seed != null);
  const committeeLabel = season < 2014 ? 'BCS' : 'CFP';
  const fieldSize = season < 2014 ? 2 : season < 2024 ? 4 : 12;

  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>#</th>
        <th>Team</th>
        <th>Conf</th>
        <th>W</th>
        <th>L</th>
        <th>Power</th>
        ${hasCommitteeRank ? `<th>${committeeLabel}</th>` : ''}
      </tr>
    </thead>
    <tbody>
      ${current.map((r, i) => {
        const isHighlighted = highlighted.has(r.team);
        const c = colors[r.team];
        const rowStyle = isHighlighted && c && HEX_COLOR_RE.test(c.color)
          ? ` style="--team-color:${c.color}"` : '';
        const rowClass = isHighlighted ? ' class="highlight-row"' : '';
        const committeeCell = r.committee_rank == null ? '' : `${r.committee_rank}${r.made_playoff ? ' *' : ''}`;
        return `
        <tr${rowClass}${rowStyle}>
          <td class="rank">${i + 1}</td>
          <td>${r.team}</td>
          <td>${r.conference ?? ''}</td>
          <td>${r.wins}</td>
          <td>${r.losses}</td>
          <td class="rating">${r.power_score.toFixed(1)}</td>
          ${hasCommitteeRank ? `<td>${committeeCell}</td>` : ''}
        </tr>
      `;
      }).join('')}
    </tbody>
  `;
  content.replaceChildren(table);

  const note = document.createElement('p');
  note.className = 'legend-note';
  note.textContent = season < 2024
    ? `Highlighted: projected top ${fieldSize} (if the season ended today).`
    : 'Highlighted: projected 12-team field -- 5 conference leaders (auto bids) + 7 at-large.';
  content.appendChild(note);

  if (hasPlayoffField) {
    const playoffNote = document.createElement('p');
    playoffNote.className = 'legend-note';
    playoffNote.textContent = isExactField
      ? `* = actually made the real ${fieldSize}-team ${committeeLabel} field.`
      : `* = currently projected to make the real ${fieldSize}-team ${committeeLabel} field, based on this week's committee ranking.`;
    content.appendChild(playoffNote);
  }
}

// Same "N. Team (W-L) -- score" format as the standalone weekly_blurb.txt
// the pipeline writes, but computed here for whichever week is currently
// selected -- that file only ever holds the latest live run's snapshot.
let currentBlurbText = '';

function renderBlurbCard(current, season, asOf, highlighted) {
  const card = document.getElementById('blurb-card');
  // Pre-2024: top 10, matching what actually got posted back then.
  // 2024+: just the projected playoff field, true rank number kept -- an
  // auto-bid conference champ ranked outside the top 12 overall still
  // shows its real position (e.g. 1-10, 14, 16), not a renumbered 1-12.
  const lines = [`CFB Power Ratings -- ${season} as of ${asOf}`];
  current.forEach((r, i) => {
    const include = season < 2024 ? i < 10 : highlighted.has(r.team);
    if (!include) return;
    lines.push(`${i + 1}. ${r.team} (${r.wins}-${r.losses}) -- ${r.power_score.toFixed(1)}`);
  });
  currentBlurbText = lines.join('\n');
  document.getElementById('blurb-text').textContent = currentBlurbText;
  card.hidden = false;
}

// Labels a season's as_of snapshots as "Week N", plus two milestones: the
// last regular-season snapshot and the last snapshot that includes
// postseason games, so those read as season-defining points rather than
// just another week. The in-progress season's own latest snapshot (no
// postseason yet) stays "Latest" rather than claiming to be final.
function computeWeekLabels(seasonRows, asOfsForSeason, isLatestSeason) {
  const stageOf = new Map();
  for (const asOf of asOfsForSeason) {
    const row = seasonRows.find(r => r.as_of === asOf);
    stageOf.set(asOf, row?.stage || 'regular');
  }
  const regularAsOfs = asOfsForSeason.filter(a => stageOf.get(a) === 'regular');
  const postAsOfs = asOfsForSeason.filter(a => stageOf.get(a) === 'postseason');
  const lastRegular = regularAsOfs[regularAsOfs.length - 1];
  const lastPost = postAsOfs[postAsOfs.length - 1];

  return asOfsForSeason.map(asOf => {
    if (stageOf.get(asOf) === 'postseason') {
      return asOf === lastPost ? 'End of Bowl Season' : 'Bowl Season';
    }
    const weekNum = regularAsOfs.indexOf(asOf) + 1;
    if (asOf === lastRegular) {
      if (postAsOfs.length > 0) return 'End of Regular Season';
      if (isLatestSeason) return 'Latest';
    }
    return `Week ${weekNum}`;
  });
}

function setupStandingsControls(rows, colors) {
  const controls = document.getElementById('standings-controls');
  const seasonSelect = document.getElementById('season-select');
  const weekSelect = document.getElementById('week-select');
  const weekPrev = document.getElementById('week-prev');
  const weekNext = document.getElementById('week-next');

  const seasons = [...new Set(rows.map(r => r.season))].sort((a, b) => b - a);
  const latestSeason = seasons[0];
  seasonSelect.replaceChildren(...seasons.map(s => new Option(String(s), String(s))));

  let asOfsForSeason = [];

  function populateWeeks(season, selectAsOf) {
    const seasonRows = rows.filter(r => r.season === season);
    asOfsForSeason = [...new Set(seasonRows.map(r => r.as_of))].sort();
    const labels = computeWeekLabels(seasonRows, asOfsForSeason, season === latestSeason);
    weekSelect.replaceChildren(
      ...asOfsForSeason.map((asOf, i) => new Option(labels[i], asOf))
    );
    weekSelect.value = selectAsOf && asOfsForSeason.includes(selectAsOf)
      ? selectAsOf
      : asOfsForSeason[asOfsForSeason.length - 1];
  }

  function updateNavButtons() {
    const idx = asOfsForSeason.indexOf(weekSelect.value);
    weekPrev.disabled = idx <= 0;
    weekNext.disabled = idx === -1 || idx >= asOfsForSeason.length - 1;
  }

  function draw() {
    updateNavButtons();
    const season = Number(seasonSelect.value);
    const asOf = weekSelect.value;
    const current = rows
      .filter(r => r.season === season && r.as_of === asOf)
      .sort((a, b) => b.power_score - a.power_score);
    const highlighted = getPlayoffProjection(current, season);
    renderStandings(current, season, asOf, colors, highlighted);
    renderBlurbCard(current, season, asOf, highlighted);
    if (window.renderTrends) window.renderTrends(rows, season, asOf);
  }

  seasonSelect.addEventListener('change', () => {
    populateWeeks(Number(seasonSelect.value));
    draw();
  });
  weekSelect.addEventListener('change', draw);
  weekPrev.addEventListener('click', () => {
    const idx = asOfsForSeason.indexOf(weekSelect.value);
    if (idx > 0) { weekSelect.value = asOfsForSeason[idx - 1]; draw(); }
  });
  weekNext.addEventListener('click', () => {
    const idx = asOfsForSeason.indexOf(weekSelect.value);
    if (idx !== -1 && idx < asOfsForSeason.length - 1) { weekSelect.value = asOfsForSeason[idx + 1]; draw(); }
  });

  seasonSelect.value = String(latestSeason);
  populateWeeks(latestSeason);
  controls.hidden = false;
  draw();

  return latestSeason;
}

async function main() {
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  let rows, colors;
  try {
    const [historyRes, colorsRes] = await Promise.all([
      fetch('data/ratings_history.json', { cache: 'no-store' }),
      fetch('data/team_colors.json', { cache: 'no-store' }),
    ]);
    if (!historyRes.ok) throw new Error(`HTTP ${historyRes.status}`);
    rows = await historyRes.json();
    colors = colorsRes.ok ? await colorsRes.json() : {};
  } catch (err) {
    subtitle.textContent = '';
    content.innerHTML = `<p class="status">Couldn't load ratings data (${err.message}).</p>`;
    return;
  }

  if (!rows.length) {
    subtitle.textContent = '';
    content.innerHTML = '<p class="status">No data yet.</p>';
    return;
  }

  document.getElementById('blurb-copy').addEventListener('click', async (e) => {
    await navigator.clipboard.writeText(currentBlurbText);
    const btn = e.currentTarget;
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = old; }, 1500);
  });

  setupStandingsControls(rows, colors);
}

main();
</script>
</body>
</html>
