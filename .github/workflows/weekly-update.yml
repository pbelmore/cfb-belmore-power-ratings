name: Weekly Ratings Update

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to pull (blank = auto-detect from today's date)"
        required: false
        default: ""
      mode:
        description: "weekly = full ratings update + Slack post; cfp = just add the latest CFP ranks"
        type: choice
        options: [weekly, cfp]
        default: weekly
  schedule:
    # Two kinds of run (see "Determine run mode" below):
    #
    # Weekly rankings -- Sun/Mon/Tue mornings, going out the morning after
    # the week's last game. Sunday and Monday only proceed once every game
    # in the current week is final (so a Monday-night game holds the week
    # until Tuesday); Tuesday proceeds regardless, so a cancelled game can't
    # hold it up forever. All three skip if no game has finished since the
    # last snapshot, so each week gets exactly one update and Slack post.
    #
    # CFP ranks -- Wednesday mornings, Nov-Dec: the committee's ranking airs
    # Tuesday night, after the weekly run is already out, so this adds it
    # to that week's existing snapshot (no new snapshot, no Slack post).
    #
    # Aug-Jan only: nothing new to pull the rest of the year. Two firings
    # per day (13:23 and 17:23 UTC): GitHub's scheduled triggers are
    # best-effort and occasionally get dropped outright (happened
    # 2026-09-29), and the second firing is a no-op if the first one
    # worked. Minute 23 rather than :00 because the top of the hour is
    # GitHub's peak scheduling load, when drops are most likely.
    - cron: "23 13,17 * 8-12,1 0,1,2"   # Sun/Mon/Tue, Aug-Jan: weekly rankings (~9:23am ET in EDT, 8:23am in EST)
    - cron: "23 13,17 * 11,12 3"        # Wed, Nov-Dec: CFP ranks

permissions:
  contents: write

# Serializes overlapping runs (a manual dispatch landing mid-cron-run, or a
# retriggered re-run) instead of letting two jobs fetch/write/push at once,
# where the second job's `git push` would be rejected non-fast-forward and
# its freshly-pulled data silently dropped. `cancel-in-progress: false`
# queues the newer run rather than killing an in-flight one mid-API-pull.
concurrency:
  group: weekly-ratings-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync to the latest commit
        # checkout gives the commit that was current when this run was
        # *triggered*. A run queued behind another by `concurrency` (e.g.
        # the backup cron waiting on a delayed first run) would otherwise
        # start from before that run's push -- comparing against stale
        # games.json in --skip-if-no-new-games, and then failing its own
        # push.
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine season year
        id: season
        env:
          # Routed through an env var, never interpolated straight into a
          # run: script -- a `${{ github.event.inputs.year }}` splice there
          # would let a workflow_dispatch caller inject arbitrary shell
          # commands into a runner holding `contents: write` and the CFBD
          # API key.
          INPUT_YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            case "$INPUT_YEAR" in
              ''|*[!0-9]*)
                echo "::error::year input must be a plain number, got: $INPUT_YEAR"
                exit 1
                ;;
            esac
            echo "year=$INPUT_YEAR" >> "$GITHUB_OUTPUT"
          else
            # No input (always true on the schedule trigger, which has no
            # workflow_dispatch inputs) -- derive the season from today's
            # date instead of a fixed year, so this keeps working every
            # season without a manual edit. The season the cron is
            # currently updating is this calendar year, except in January,
            # when it's still last calendar year's season winding down.
            if [ "$(date -u +%m)" = "01" ]; then
              echo "year=$(( $(date -u +%Y) - 1 ))" >> "$GITHUB_OUTPUT"
            else
              echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Determine run mode
        id: mode
        env:
          # Via env var, not a ${{ }} splice, for the same injection reason
          # as INPUT_YEAR above; only the two known values map to anything.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs always go through -- no skip checks.
            case "$INPUT_MODE" in
              cfp) echo "flags=--cfp-ranks-only" >> "$GITHUB_OUTPUT"; echo "label=CFP ranks update" >> "$GITHUB_OUTPUT" ;;
              *)   echo "flags=" >> "$GITHUB_OUTPUT"; echo "label=Weekly update" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # Day of week (UTC; same calendar day as ET at 13:23/17:23).
            case "$(date -u +%u)" in
              3)   echo "flags=--cfp-ranks-only" >> "$GITHUB_OUTPUT"; echo "label=CFP ranks update" >> "$GITHUB_OUTPUT" ;;
              7|1) echo "flags=--skip-if-no-new-games --require-complete-week" >> "$GITHUB_OUTPUT"; echo "label=Weekly update" >> "$GITHUB_OUTPUT" ;;
              *)   echo "flags=--skip-if-no-new-games" >> "$GITHUB_OUTPUT"; echo "label=Weekly update" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - run: pip install -r requirements.txt

      - name: Run update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON_YEAR: ${{ steps.season.outputs.year }}
          RUN_FLAGS: ${{ steps.mode.outputs.flags }}
        # Only writes the Slack message (weekly runs, 2024+ seasons) -- the
        # "Post to Slack" step below sends it once the data is safely
        # pushed. A skipped run writes nothing, so there's nothing to post.
        # $RUN_FLAGS is deliberately unquoted: it's zero or more flags.
        run: python scripts/weekly_update.py --year "$SEASON_YEAR" --slack-message-out "$RUNNER_TEMP/slack_message.txt" $RUN_FLAGS

      - name: Commit and push updated data
        env:
          COMMIT_LABEL: ${{ steps.mode.outputs.label }}
        run: |
          git config user.name "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/teams.json data/games.json data/ratings_history.json data/weekly_blurb.txt data/team_colors.json
          git diff --staged --quiet || git commit -m "$COMMIT_LABEL $(date -u +%F)"
          # Rebased onto anything pushed to the branch mid-run (e.g. a code
          # change) rather than failing non-fast-forward and dropping this
          # week's data -- the bot only ever touches data/, so this can't
          # conflict with a code push.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Post to Slack
        # Last, and only once the push above succeeded: a Slack failure
        # can't block the site's data update, and a failed push can't leave
        # behind a Slack post that the backup cron run would then repeat. A
        # failure here still marks the run failed (so it gets noticed), but
        # the backup run won't retry it -- this week's snapshot is already
        # in, so --skip-if-no-new-games stops it.
        env:
          # Optional -- unset just skips posting.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          message="$RUNNER_TEMP/slack_message.txt"
          if [ -z "$SLACK_WEBHOOK_URL" ] || [ ! -s "$message" ]; then
            echo "No Slack webhook configured, or no message for this season -- skipping."
            exit 0
          fi
          jq -Rs '{text: .}' "$message" \
            | curl -sS --fail-with-body --max-time 15 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
