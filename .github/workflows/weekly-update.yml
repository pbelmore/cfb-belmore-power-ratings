name: Weekly Ratings Update

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to pull (blank = auto-detect from today's date)"
        required: false
        default: ""
  schedule:
    # Tuesdays through October: no CFP/BCS committee ranking exists yet to
    # race ahead of (verified against real release history, 2019-2025 --
    # the first ranking of a season has never come out before very late
    # October), so pulling a day earlier than November onward just means
    # fresher data with nothing to lose.
    #
    # Wednesdays from November on: the committee's rankings air Tuesday
    # night starting that month, so a Tuesday-morning run would race ahead
    # of that week's ranking and miss it until the following week's run.
    #
    # Aug-Jan only: the season runs roughly late August through mid-
    # January, so there's nothing new to pull the rest of the year --
    # without this, the Action would just keep re-running against an
    # already-finished season indefinitely each offseason.
    #
    # Two firings per day (13:23 and 17:23 UTC), not one: GitHub's
    # scheduled triggers are best-effort and occasionally get dropped
    # outright (happened 2026-09-29 -- no run was created at all). The
    # 17:23 firing is a backup that exits early via the "already ran
    # today" check below if the 13:23 one succeeded, and Slack is only
    # posted after the data push succeeds, so it never posts twice. Minute 23 rather than :00 because the top of the hour
    # is GitHub's peak scheduling load, when drops are most likely.
    - cron: "23 13,17 * 8-10 2"      # Tuesdays, Aug-Oct, ~9:23am ET + 1:23pm ET backup (EDT)
    - cron: "23 13,17 * 11-12,1 3"   # Wednesdays, Nov-Jan, ~8:23am ET + 12:23pm ET backup (EST)

permissions:
  contents: write

# Serializes overlapping runs (a manual dispatch landing mid-cron-run, or a
# retriggered re-run) instead of letting two jobs fetch/write/push at once,
# where the second job's `git push` would be rejected non-fast-forward and
# its freshly-pulled data silently dropped. `cancel-in-progress: false`
# queues the newer run rather than killing an in-flight one mid-API-pull.
concurrency:
  group: weekly-ratings-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync to the latest commit
        # checkout gives the commit that was current when this run was
        # *triggered*. A run queued behind another by `concurrency` (e.g.
        # the backup cron waiting on a delayed first run) would otherwise
        # start from before that run's push -- missing today's snapshot in
        # the guard below, and then failing its own push.
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine season year
        id: season
        env:
          # Routed through an env var, never interpolated straight into a
          # run: script -- a `${{ github.event.inputs.year }}` splice there
          # would let a workflow_dispatch caller inject arbitrary shell
          # commands into a runner holding `contents: write` and the CFBD
          # API key.
          INPUT_YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            case "$INPUT_YEAR" in
              ''|*[!0-9]*)
                echo "::error::year input must be a plain number, got: $INPUT_YEAR"
                exit 1
                ;;
            esac
            echo "year=$INPUT_YEAR" >> "$GITHUB_OUTPUT"
          else
            # No input (always true on the schedule trigger, which has no
            # workflow_dispatch inputs) -- derive the season from today's
            # date instead of a fixed year, so this keeps working every
            # season without a manual edit. The season the cron is
            # currently updating is this calendar year, except in January,
            # when it's still last calendar year's season winding down.
            if [ "$(date -u +%m)" = "01" ]; then
              echo "year=$(( $(date -u +%Y) - 1 ))" >> "$GITHUB_OUTPUT"
            else
              echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Skip if today's update already ran
        id: guard
        # Scheduled runs only -- a manual workflow_dispatch always runs.
        # The backup cron firing lands here and stops if the earlier one
        # already wrote today's snapshot for this season, so a normal week
        # gets exactly one pull, one commit, and one Slack post. Matched on
        # season too, so a same-day manual re-pull of some other season
        # doesn't make the scheduled current-season run skip.
        if: github.event_name == 'schedule'
        env:
          SEASON_YEAR: ${{ steps.season.outputs.year }}
        run: |
          if python -c "import json, os, sys, datetime; today = datetime.datetime.now(datetime.timezone.utc).date().isoformat(); season = int(os.environ['SEASON_YEAR']); sys.exit(0 if any(r['season'] == season and r['as_of'] == today for r in json.load(open('data/ratings_history.json'))) else 1)"; then
            echo "Today's $SEASON_YEAR snapshot already exists -- skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run weekly update
        if: steps.guard.outputs.skip != 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON_YEAR: ${{ steps.season.outputs.year }}
        # Only writes the Slack message (2024+ seasons) -- the "Post to
        # Slack" step below sends it once the data is safely pushed.
        run: python scripts/weekly_update.py --year "$SEASON_YEAR" --slack-message-out "$RUNNER_TEMP/slack_message.txt"

      - name: Commit and push updated data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/teams.json data/games.json data/ratings_history.json data/weekly_blurb.txt data/team_colors.json
          git diff --staged --quiet || git commit -m "Weekly update $(date -u +%F)"
          # Rebased onto anything pushed to the branch mid-run (e.g. a code
          # change) rather than failing non-fast-forward and dropping this
          # week's data -- the bot only ever touches data/, so this can't
          # conflict with a code push.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Post to Slack
        # Last, and only once the push above succeeded: a Slack failure
        # can't block the site's data update, and a failed push can't leave
        # behind a Slack post that the backup cron run would then repeat. A
        # failure here still marks the run failed (so it gets noticed), but
        # the backup run won't retry it -- today's snapshot is already in.
        if: steps.guard.outputs.skip != 'true'
        env:
          # Optional -- unset just skips posting.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          message="$RUNNER_TEMP/slack_message.txt"
          if [ -z "$SLACK_WEBHOOK_URL" ] || [ ! -s "$message" ]; then
            echo "No Slack webhook configured, or no message for this season -- skipping."
            exit 0
          fi
          jq -Rs '{text: .}' "$message" \
            | curl -sS --fail-with-body --max-time 15 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
