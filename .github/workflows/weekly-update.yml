name: Weekly Ratings Update

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year to pull"
        required: false
        default: "2026"
  # Enabled once a manual run has been verified end-to-end:
  # schedule:
  #   - cron: "0 13 * * 2"   # Tuesdays, 9am ET

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run weekly update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/weekly_update.py --year ${{ github.event.inputs.year || '2026' }}

      - name: Commit and push updated data
        run: |
          git config user.name "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/teams.json data/games.json data/ratings_history.json
          git diff --staged --quiet || git commit -m "Weekly update $(date -u +%F)"
          git push
